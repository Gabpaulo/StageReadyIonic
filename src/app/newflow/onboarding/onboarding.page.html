<ion-content [fullscreen]="true" class="ion-padding">
  <swiper-container
    [slides-per-view]="1"
    [pagination]="true"
    [space-between]="20"
    (slidechange)="onSlideChange($event)"
    #swiperEl
  >
    <swiper-slide *ngFor="let slide of onboardingSlides; let i = index">
      <ion-card class="onboarding-card">
        <img [src]="slide.image" alt="Slide image" />
        <ion-card-header>
          <ion-card-title>{{ slide.title }}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <ng-container *ngIf="i !== onboardingSlides.length - 1; else authButtons">
            {{ slide.description }}
          </ng-container>

          <ng-template #authButtons>
            <p>{{ slide.description }}</p>
            <ion-button expand="block" routerLink="/home">Get Started</ion-button>
          </ng-template>

        </ion-card-content>
      </ion-card>
    </swiper-slide>
  </swiper-container>
</ion-content>
