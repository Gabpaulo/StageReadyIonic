<ion-content [fullscreen]="true">
  <swiper-container
    [slides-per-view]="1"
    [pagination]="true"
    [space-between]="20"
    (slidechange)="onSlideChange($event)"
    #swiperEl
  >
    <swiper-slide *ngFor="let slide of onboardingSlides; let i = index">
      <div class="onboarding-content">
        <div class="image-container">
          <img [src]="slide.image" alt="Slide image" />
        </div>
        
        <h1 class="slide-title">{{ slide.title }}</h1>
        
        <p class="slide-description">{{ slide.description }}</p>
        
        <div class="button-container" *ngIf="i === onboardingSlides.length - 1">
          <ion-button expand="block" (click)="completeOnboarding()">Get Started</ion-button>
        </div>
      </div>
    </swiper-slide>
  </swiper-container>
</ion-content>
