<ion-content class="login-bg">
  <div class="login-container">

    <div class="brand">
      <img src="assets/icon/stagereadylogo.svg" alt="StageReady" class="app-logo">
      <h1>StageReady</h1>
      <p>Your personal public speaking coach</p>
    </div>

    <!-- ── Login ── -->
    <div class="auth-card" *ngIf="!showRegister">
      <h2>Sign in</h2>

      <div class="field">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          class="field-input"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          class="field-input"
          autocomplete="current-password"
        >
      </div>

      <button class="btn-primary" (click)="signIn()">Sign in</button>
      <button class="btn-google" (click)="signInWithGoogle()">Continue with Google</button>
      <button class="btn-link" (click)="toggleRegister()">No account? Create one</button>
    </div>

    <!-- ── Register ── -->
    <div class="auth-card" *ngIf="showRegister">
      <h2>Create account</h2>

      <div class="field">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          class="field-input"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          class="field-input"
          autocomplete="new-password"
        >
      </div>

      <div class="field">
        <label>Confirm password</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          class="field-input"
          autocomplete="new-password"
        >
        <p class="error-text" *ngIf="password && confirmPassword && password !== confirmPassword">
          Passwords don't match.
        </p>
      </div>

      <button class="btn-primary" (click)="register()">Create account</button>
      <button class="btn-link" (click)="toggleRegister()">Already have an account? Sign in</button>
    </div>

  </div>
</ion-content>
