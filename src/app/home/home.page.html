

<ion-content class="login-bg">
      <div class="login-container">
        <img src="assets/icon/logo.svg" alt="Stage Ready Logo" class="app-logo">
        <h1 class="login-title">Stage Ready</h1>
        <h2 class="login-subtitle">Your AI Public Speaking Coach</h2>
    <ion-card class="login-card" *ngIf="!showRegister">
      <ion-card-header>
        <ion-card-title>Login</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-input
            [(ngModel)]="email"
            type="email"
            placeholder="Enter your email"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            [(ngModel)]="password"
            type="password"
            placeholder="Enter your password"
          ></ion-input>
        </ion-item>
        <ion-button expand="block" color="primary" (click)="signIn()">Log In</ion-button>
        <div class="google-login-link" (click)="signInWithGoogle()">
          <span>Log in with Google</span>
        </div>
        <ion-button fill="clear" expand="block" (click)="toggleRegister()">
          Don't have an account? Register
        </ion-button>
      </ion-card-content>
    </ion-card>
    <ion-card class="login-card" *ngIf="showRegister">
      <ion-card-header>
        <ion-card-title>Register</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-input
            [(ngModel)]="email"
            type="email"
            placeholder="Enter your email"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            [(ngModel)]="password"
            type="password"
            placeholder="Enter your password"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            [(ngModel)]="confirmPassword"
            type="password"
            placeholder="Re‑enter your password"
          ></ion-input>
        </ion-item>
        <p
          *ngIf="password && confirmPassword && password !== confirmPassword"
          class="error-text"
        >
          Passwords don’t match.
        </p>
        <ion-button expand="block" color="primary" (click)="register()">Register</ion-button>
        <ion-button fill="clear" expand="block" (click)="toggleRegister()">
          Already have an account? Log In
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
