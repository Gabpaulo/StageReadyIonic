

<ion-content class="ion-padding">
  <ion-card *ngIf="!showRegister">
    <ion-card-header>
      <ion-card-title>Login</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-input
          [(ngModel)]="email"
          type="email"
          placeholder="Enter your email"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          [(ngModel)]="password"
          type="password"
          placeholder="Enter your password"
        ></ion-input>
      </ion-item>
      <ion-button expand="block" (click)="signIn()">Log In</ion-button>
      <ion-button fill="clear" expand="block" (click)="toggleRegister()">
        Don’t have an account? Register
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="showRegister">
    <ion-card-header>
      <ion-card-title>Register</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-input
          [(ngModel)]="email"
          type="email"
          placeholder="Enter your email"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          [(ngModel)]="password"
          type="password"
          placeholder="Enter your password"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          [(ngModel)]="confirmPassword"
          type="password"
          placeholder="Re‑enter your password"
        ></ion-input>
      </ion-item>

      <p
        *ngIf="password && confirmPassword && password !== confirmPassword"
        class="error-text"
      >
        Passwords don’t match.
      </p>

      <!-- disable until emails + both passwords are non‑empty AND match -->
      <ion-button
        expand="block"
        (click)="register()"
        [disabled]="
          !email ||
          !password ||
          !confirmPassword ||
          password !== confirmPassword
        "
      >
        Register
      </ion-button>
      <ion-button fill="clear" expand="block" (click)="toggleRegister()">
        Back to Login
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
