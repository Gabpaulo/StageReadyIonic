<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">profile</ion-title>
    </ion-toolbar>
  </ion-header>

  <ng-container *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading profile...</p>
  </ng-container>

  <ng-container *ngIf="!loading && error">
    <ion-text color="danger">{{ error }}</ion-text>
  </ng-container>

  <ng-container *ngIf="!loading && userProfile">
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ (userProfile.firstName || '') + ' ' + (userProfile.lastName || '') }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" (click)="openEditModal()">Edit Profile</ion-button>
      </ion-card-content>
    </ion-card>
  </ng-container>

  <ion-modal [isOpen]="editModalOpen" (didDismiss)="closeEditModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Edit Profile</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeEditModal()">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <form (ngSubmit)="saveProfile()">
          <ion-item>
            <ion-label position="stacked">First Name</ion-label>
            <ion-input [(ngModel)]="formData.firstName" name="firstName" required></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="stacked">Last Name</ion-label>
            <ion-input [(ngModel)]="formData.lastName" name="lastName" required></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="stacked">Age</ion-label>
            <ion-input type="number" [(ngModel)]="formData.age" name="age"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="stacked">Phone</ion-label>
            <ion-input [(ngModel)]="formData.phone" name="phone"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="stacked">Gender</ion-label>
            <ion-select [(ngModel)]="formData.gender" name="gender">
              <ion-select-option value="Male">Male</ion-select-option>
              <ion-select-option value="Female">Female</ion-select-option>
              <ion-select-option value="Other">Other</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-item>
            <ion-label>Interests</ion-label>
            <ion-select [(ngModel)]="formData.interests" multiple="true" interface="popover" placeholder="Select interests" name="interests">
              <ion-select-option *ngFor="let option of interestOptions" [value]="option">
                {{ option }}
              </ion-select-option>
            </ion-select>
          </ion-item>
          <ion-item>
            <ion-label position="stacked">Bio</ion-label>
            <ion-textarea [(ngModel)]="formData.bio" name="bio"></ion-textarea>
          </ion-item>
          <ion-button expand="block" type="submit" [disabled]="saving">
            <ion-spinner *ngIf="saving" name="crescent"></ion-spinner>
            <span *ngIf="!saving">Save</span>
          </ion-button>
          <ion-button expand="block" color="medium" (click)="closeEditModal()" [disabled]="saving">Cancel</ion-button>
        </form>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
