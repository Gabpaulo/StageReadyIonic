<ion-header class="custom-header">
  <ion-toolbar>
    <ion-title>Speech Analysis</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="custom-content">
  <div class="hero-section">
    <h1>Speech Analysis</h1>
    <p>Get AI-powered feedback on your speaking skills</p>
  </div>

  <div class="main-container">
    <!-- Recording Section -->
    <div class="recording-section" *ngIf="!audioUrl && !isLoading">
      <div class="mic-container" [class.recording]="isRecording">
        <div class="pulse-ring" *ngIf="isRecording"></div>
        <div class="pulse-ring delay-1" *ngIf="isRecording"></div>
        <div class="pulse-ring delay-2" *ngIf="isRecording"></div>
        <ion-button
          class="record-button"
          [class.stop-button]="isRecording"
          (click)="isRecording ? stopRecording() : startRecording()"
        >
          <ion-icon [name]="isRecording ? 'stop' : 'mic'"></ion-icon>
        </ion-button>
      </div>
      <p class="recording-text" *ngIf="isRecording">Recording in progress...</p>
      <p class="instruction-text" *ngIf="!isRecording">Tap to start recording</p>
    </div>

    <!-- Audio Preview Section -->
    <div class="preview-section" *ngIf="audioUrl && !isLoading">
      <div class="audio-card">
        <div class="waveform-placeholder">
          <div class="wave"></div>
          <div class="wave"></div>
          <div class="wave"></div>
          <div class="wave"></div>
          <div class="wave"></div>
        </div>
        <audio [src]="audioUrl" controls class="custom-audio"></audio>
        <div class="action-buttons">
          <ion-button
            class="analyze-button"
            expand="block"
            (click)="analyzeRecording()"
          >
            <ion-icon name="analytics" slot="start"></ion-icon>
            Analyze Recording
          </ion-button>
          <ion-button
            class="reset-button"
            expand="block"
            fill="clear"
            (click)="resetRecording()"
          >
            <ion-icon name="refresh" slot="start"></ion-icon>
            Record Again
          </ion-button>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-section" *ngIf="isLoading">
      <div class="loader">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
      <p>Analyzing your speech...</p>
    </div>
  </div>
</ion-content>
