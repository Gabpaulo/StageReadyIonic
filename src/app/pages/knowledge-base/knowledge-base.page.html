<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Knowledge Base</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Knowledge Base</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Page Intro -->
  <div class="page-intro">
    <ion-icon name="library-outline" class="intro-icon"></ion-icon>
    <p>Open-source resources to help you become a better speaker. Tap any card to visit the resource.</p>
  </div>

  <!-- Category Filter Chips -->
  <div class="category-chips">
    <ion-chip
      *ngFor="let cat of categories"
      [color]="selectedCategory === cat ? 'primary' : 'medium'"
      [outline]="selectedCategory !== cat"
      (click)="filterByCategory(cat)">
      <ion-label>{{ cat }}</ion-label>
    </ion-chip>
  </div>

  <!-- Error Banner -->
  <ion-card *ngIf="error" class="error-card">
    <ion-card-content>
      <div class="error-content">
        <ion-icon name="cloud-offline-outline" class="error-icon"></ion-icon>
        <p>{{ error }}</p>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Loading Skeleton -->
  <div *ngIf="loading" class="skeleton-list">
    <ion-card *ngFor="let i of [1,2,3,4]" class="resource-card">
      <ion-card-content>
        <div class="resource-content">
          <ion-skeleton-text [animated]="true" style="width: 48px; height: 48px; border-radius: 12px;"></ion-skeleton-text>
          <div class="resource-info" style="flex: 1;">
            <ion-skeleton-text [animated]="true" style="width: 60%; height: 20px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true" style="width: 30%; height: 14px; margin-top: 6px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true" style="width: 90%; height: 14px; margin-top: 8px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true" style="width: 75%; height: 14px; margin-top: 4px;"></ion-skeleton-text>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Resource Cards -->
  <div *ngIf="!loading" class="resource-list">
    <ion-card
      *ngFor="let resource of filteredResources"
      class="resource-card"
      (click)="openResource(resource.url)"
      button>
      <ion-card-content>
        <div class="resource-content">
          <div class="resource-icon-wrapper">
            <ion-icon [name]="resource.icon" class="resource-icon"></ion-icon>
          </div>
          <div class="resource-info">
            <h3 class="resource-title">{{ resource.title }}</h3>
            <ion-badge color="tertiary" class="resource-category">{{ resource.category }}</ion-badge>
            <p class="resource-description">{{ resource.description }}</p>
            <div class="resource-link">
              <ion-icon name="open-outline"></ion-icon>
              <span>Visit Resource</span>
            </div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Empty State -->
    <div *ngIf="filteredResources.length === 0" class="empty-state">
      <ion-icon name="search-outline" class="empty-icon"></ion-icon>
      <p>No resources found for this category.</p>
      <ion-button fill="outline" size="small" (click)="filterByCategory('All')">Show All</ion-button>
    </div>
  </div>
</ion-content>
