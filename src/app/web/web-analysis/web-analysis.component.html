<div class="analysis-page">
  <div class="main-container">

    <!-- Speech Type Pill -->
    <div class="type-row">
      <span class="type-label">Speech type</span>
      <button class="type-pill" (click)="openTypeDialog()">
        <mat-icon>mic</mat-icon>
        {{ hasConfirmedSpeechType ? (speechType | titlecase) : 'Select type' }}
        <mat-icon class="chevron">expand_more</mat-icon>
      </button>
    </div>

    <!-- ── IDLE / RECORDING ── -->
    <div class="card record-card" *ngIf="!audioUrl && !isLoading && !isProcessingRecording">

      <div class="mic-wrap" [class.recording]="isRecording">
        <div class="pulse-ring"         *ngIf="isRecording"></div>
        <div class="pulse-ring delay-1" *ngIf="isRecording"></div>
        <div class="pulse-ring delay-2" *ngIf="isRecording"></div>

        <button
          class="mic-btn"
          [class.stop]="isRecording"
          [disabled]="!hasConfirmedSpeechType"
          (click)="isRecording ? stopRecording() : startRecording()"
        >
          <mat-icon>{{ isRecording ? 'stop' : 'mic' }}</mat-icon>
        </button>
      </div>

      <!-- Visualizer -->
      <div class="visualizer" *ngIf="isRecording">
        <div class="vis-bar"
             *ngFor="let level of audioLevels"
             [style.height.px]="10 + (level * 70)">
        </div>
      </div>

      <p class="status-text recording" *ngIf="isRecording">
        <span class="rec-dot"></span>
        Recording… {{ formatDuration(recordingDuration) }}
      </p>
      <p class="status-text" *ngIf="!isRecording && hasConfirmedSpeechType">
        Click the mic to start
      </p>
      <p class="status-text muted" *ngIf="!isRecording && !hasConfirmedSpeechType">
        Select a speech type above to begin
      </p>
    </div>

    <!-- ── PROCESSING ── -->
    <div class="card state-card" *ngIf="isProcessingRecording && !audioUrl">
      <div class="state-icon processing">
        <mat-icon>mic</mat-icon>
      </div>
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
      <h3>Processing audio…</h3>
      <p>Converting your recording</p>
    </div>

    <!-- ── PREVIEW ── -->
    <div class="card preview-card" *ngIf="audioUrl && !isLoading">
      <div class="wave-anim">
        <span *ngFor="let _ of [1,2,3,4,5]" class="wave-bar"></span>
      </div>

      <audio [src]="audioUrl" controls class="audio-player"></audio>

      <div class="converting-row" *ngIf="isConverting">
        <mat-spinner diameter="20"></mat-spinner>
        <span>Preparing for analysis…</span>
      </div>

      <div class="btn-row">
        <button
          class="btn-analyze"
          [disabled]="!hasConfirmedSpeechType || isConverting"
          (click)="analyzeRecording()"
        >
          <mat-icon>{{ isConverting ? 'hourglass_empty' : 'analytics' }}</mat-icon>
          {{ isConverting ? 'Preparing…' : 'Analyze Speech' }}
        </button>

        <button
          class="btn-reset"
          [disabled]="isConverting"
          (click)="resetRecording()"
        >
          <mat-icon>refresh</mat-icon>
          Record Again
        </button>
      </div>
    </div>

    <!-- ── ANALYZING ── -->
    <div class="card state-card" *ngIf="isLoading">
      <div class="state-icon analyzing">
        <mat-icon>analytics</mat-icon>
      </div>
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
      <h3>Analyzing your speech</h3>
      <p>Transcribing &amp; scoring with AI…</p>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

  </div>
</div>
