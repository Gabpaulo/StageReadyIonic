<ion-split-pane contentId="main-content" when="(min-width: 768px)" class="app-container">
  <!-- Left-side navigation menu -->
  <ion-menu contentId="main-content" type="overlay" class="sidenav" [class.mat-sidenav-closed]="!sidebarOpen">
    <ion-header class="sidenav-toolbar">
      <ion-toolbar>
        <div class="brand-section">
          <div class="brand-icon">
            <ion-icon name="mic-outline"></ion-icon>
          </div>
          <ion-title>StageReady</ion-title>
        </div>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list class="nav-list">
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/web/dashboard" routerLinkActive="active" detail="false" class="nav-item">
            <div class="nav-item-content">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Dashboard</ion-label>
            </div>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/web/badges" routerLinkActive="active" detail="false" class="nav-item">
            <div class="nav-item-content">
              <ion-icon slot="start" name="trophy-outline"></ion-icon>
              <ion-label>Badges</ion-label>
            </div>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/web/history" routerLinkActive="active" detail="false" class="nav-item">
            <div class="nav-item-content">
              <ion-icon slot="start" name="stats-chart-outline"></ion-icon>
              <ion-label>Speech History</ion-label>
            </div>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/web/practice-mode" routerLinkActive="active" detail="false" class="nav-item practice-mode-nav">
            <div class="nav-item-content">
              <ion-icon slot="start" name="musical-notes-outline"></ion-icon>
              <ion-label>Practice Mode</ion-label>
            </div>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/web/analysis" routerLinkActive="active" detail="false" class="nav-item">
            <div class="nav-item-content">
              <ion-icon slot="start" name="mic-outline"></ion-icon>
              <ion-label>Speech Analysis</ion-label>
            </div>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/web/feedback" routerLinkActive="active" detail="false" class="nav-item">
            <div class="nav-item-content">
              <ion-icon slot="start" name="chatbubbles-outline"></ion-icon>
              <ion-label>Speech Feedback</ion-label>
            </div>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/web/knowledge-base" routerLinkActive="active" detail="false" class="nav-item">
            <div class="nav-item-content">
              <ion-icon slot="start" name="library-outline"></ion-icon>
              <ion-label>Knowledge Base</ion-label>
            </div>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/web/profile" routerLinkActive="active" detail="false" class="nav-item">
            <div class="nav-item-content">
              <ion-icon slot="start" name="person-outline"></ion-icon>
              <ion-label>Profile</ion-label>
            </div>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  
  <!-- Main content area -->
  <div id="main-content" class="main-content">
    <ion-header class="main-toolbar">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button (click)="toggleSidebar()"></ion-menu-button>
        </ion-buttons>
        <ion-title class="app-title">
          StageReady
        </ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="logout()">
            <ion-icon slot="icon-only" name="log-out"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>

    <ion-footer class="mobile-bottom-nav">
      <ion-toolbar>
        <div class="bottom-nav">
          <ion-button fill="clear" size="small" routerLink="/web/dashboard" routerLinkActive="active" class="bottom-nav-button">
            <ion-icon name="home-outline"></ion-icon>
            <span>Dashboard</span>
          </ion-button>
          <ion-button fill="clear" size="small" routerLink="/web/badges" routerLinkActive="active" class="bottom-nav-button">
            <ion-icon name="trophy-outline"></ion-icon>
            <span>Badges</span>
          </ion-button>
          <ion-button fill="clear" size="small" routerLink="/web/history" routerLinkActive="active" class="bottom-nav-button">
            <ion-icon name="stats-chart-outline"></ion-icon>
            <span>History</span>
          </ion-button>
          <ion-button fill="clear" size="small" routerLink="/web/practice-mode" routerLinkActive="active" class="bottom-nav-button">
            <ion-icon name="musical-notes-outline"></ion-icon>
            <span>Practice</span>
          </ion-button>
          <ion-button fill="clear" size="small" routerLink="/web/analysis" routerLinkActive="active" class="bottom-nav-button">
            <ion-icon name="mic-outline"></ion-icon>
            <span>Analysis</span>
          </ion-button>
          <ion-button fill="clear" size="small" routerLink="/web/feedback" routerLinkActive="active" class="bottom-nav-button">
            <ion-icon name="chatbubbles-outline"></ion-icon>
            <span>Feedback</span>
          </ion-button>
          <ion-button fill="clear" size="small" routerLink="/web/profile" routerLinkActive="active" class="bottom-nav-button">
            <ion-icon name="person-outline"></ion-icon>
            <span>Profile</span>
          </ion-button>
        </div>
      </ion-toolbar>
    </ion-footer>
  </div>
</ion-split-pane>
