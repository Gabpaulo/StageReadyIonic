<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-labelledby="t">
  <title id="t">Magnifying glass over an empty page</title>
  <defs>
    <radialGradient id="nf-glow" cx="190" cy="150" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22a7f0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22a7f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="190" cy="150" r="130" fill="url(#nf-glow)"/>
  <ellipse cx="200" cy="272" rx="130" ry="10" fill="#22a7f0" opacity=".12"/>

  <!-- stacked pages / books -->
  <rect x="104" y="72" width="132" height="170" rx="12" fill="#1e2c3a" stroke="#2b3b4c" stroke-width="2" transform="rotate(-8 170 157)"/>
  <rect x="120" y="64" width="132" height="176" rx="12" fill="#22303f" stroke="#384a5e" stroke-width="2"/>
  <rect x="140" y="88" width="70" height="8" rx="4" fill="#22a7f0" opacity=".8"/>
  <rect x="140" y="108" width="92" height="6" rx="3" fill="#455970"/>
  <rect x="140" y="122" width="80" height="6" rx="3" fill="#455970"/>
  <rect x="140" y="136" width="88" height="6" rx="3" fill="#455970"/>
  <rect x="140" y="160" width="60" height="6" rx="3" fill="#384a5e"/>
  <rect x="140" y="174" width="76" height="6" rx="3" fill="#384a5e"/>

  <!-- magnifier -->
  <circle cx="250" cy="160" r="46" fill="#17232f" fill-opacity=".75" stroke="#22a7f0" stroke-width="10"/>
  <circle cx="250" cy="160" r="46" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <path d="M284 194l40 40" stroke="#1b8fd3" stroke-width="16" stroke-linecap="round"/>
  <path d="M284 194l40 40" stroke="#22a7f0" stroke-width="8" stroke-linecap="round"/>
  <!-- question mark -->
  <path d="M238 148c0-8 6-14 13-14s13 5 13 12c0 10-12 10-12 20" stroke="#00bcd4" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="252" cy="180" r="4.5" fill="#00bcd4"/>
  <path d="M222 138a32 32 0 0 1 18-14" stroke="#ffffff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M86 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#22a7f0"/>
  <path d="M330 80l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffc409" opacity=".85"/>
  <circle cx="90" cy="200" r="3" fill="#9bb2c8" opacity=".6"/>
  <circle cx="340" cy="140" r="3" fill="#9bb2c8" opacity=".6"/>
</svg>
