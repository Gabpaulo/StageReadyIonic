<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-labelledby="t">
  <title id="t">Trophy on a winners podium</title>
  <defs>
    <linearGradient id="w-cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <radialGradient id="w-glow" cx="200" cy="110" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22a7f0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#22a7f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="200" cy="110" r="120" fill="url(#w-glow)"/>
  <ellipse cx="200" cy="274" rx="150" ry="10" fill="#22a7f0" opacity=".12"/>

  <!-- podium -->
  <rect x="80" y="214" width="80" height="60" rx="6" fill="#2b3b4c"/>
  <rect x="160" y="190" width="80" height="84" rx="6" fill="#22a7f0"/>
  <rect x="240" y="230" width="80" height="44" rx="6" fill="#1e2c3a" stroke="#2b3b4c" stroke-width="2"/>
  <text x="120" y="252" text-anchor="middle" font-family="Roboto, sans-serif" font-size="22" font-weight="800" fill="#9bb2c8">2</text>
  <text x="200" y="240" text-anchor="middle" font-family="Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff">1</text>
  <text x="280" y="260" text-anchor="middle" font-family="Roboto, sans-serif" font-size="20" font-weight="800" fill="#6b8299">3</text>

  <!-- trophy -->
  <path d="M168 64h64v34c0 22-14 38-32 38s-32-16-32-38z" fill="url(#w-cup)"/>
  <path d="M168 74h-14c0 20 8 30 18 32" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
  <path d="M232 74h14c0 20-8 30-18 32" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
  <rect x="193" y="134" width="14" height="22" fill="#f5a623"/>
  <rect x="176" y="156" width="48" height="12" rx="4" fill="#384a5e"/>
  <rect x="170" y="168" width="60" height="22" rx="5" fill="#2b3b4c"/>
  <path d="M200 80l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#ffffff" opacity=".9"/>
  <path d="M178 70c0 12 2 22 8 30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".35"/>

  <!-- medal ribbons -->
  <path d="M96 150l12 22 12-22" stroke="#00bcd4" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="108" cy="184" r="14" fill="#9bb2c8"/>
  <circle cx="108" cy="184" r="8" fill="#e8f1f9"/>
  <path d="M280 160l12 22 12-22" stroke="#22a7f0" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="292" cy="196" r="14" fill="#c9824a"/>
  <circle cx="292" cy="196" r="8" fill="#e8a46a"/>

  <!-- confetti -->
  <rect x="70" y="60" width="10" height="5" rx="2" fill="#22a7f0" transform="rotate(-25 75 62)"/>
  <rect x="320" y="70" width="10" height="5" rx="2" fill="#ffc409" transform="rotate(30 325 72)"/>
  <rect x="120" y="30" width="8" height="4" rx="2" fill="#00bcd4" transform="rotate(15 124 32)"/>
  <rect x="280" y="34" width="8" height="4" rx="2" fill="#eb445a" transform="rotate(-20 284 36)"/>
  <circle cx="150" cy="100" r="3" fill="#ffc409"/>
  <circle cx="256" cy="120" r="3" fill="#22a7f0"/>
  <path d="M340 120l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffc409"/>
  <path d="M56 120l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#22a7f0"/>
</svg>
